<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Construction AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #f5f5f5;
    }

    #ar-button {
      background: #111;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    src="ConstructionAR_House.glb"
    alt="Construction AR House"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed">

    <button slot="ar-button" id="ar-button">
      🏠 ดูบ้านใน AR
    </button>

  </model-viewer>

</body>
</html>
